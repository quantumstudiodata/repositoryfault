<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraer códigos de PDF a Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8;
    --border:#334155; --ok:#22c55e; --err:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:32px; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  h1{font-size:1.4rem; margin:0 0 6px;}
  p.sub{color:var(--muted); margin:0 0 24px; font-size:.92rem;}
  .drop{
    border:2px dashed var(--border); border-radius:12px; padding:32px 16px;
    text-align:center; cursor:pointer; transition:.15s; margin-bottom:16px;
  }
  .drop:hover, .drop.drag{ border-color:var(--accent); background:rgba(56,189,248,.06); }
  .drop input{display:none;}
  .drop .icon{font-size:2rem; margin-bottom:8px;}
  .drop .fname{color:var(--accent); margin-top:8px; font-size:.85rem; word-break:break-all;}
  label.opt{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); margin-bottom:16px;}
  label.opt input{width:64px; padding:4px 8px; background:#0f172a; border:1px solid var(--border); color:var(--text); border-radius:6px;}
  button{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
    color:#0f172a; font-weight:600; font-size:.95rem; cursor:pointer; transition:.15s;
  }
  button:disabled{opacity:.5; cursor:not-allowed;}
  button:hover:not(:disabled){filter:brightness(1.08);}
  .status{margin-top:16px; font-size:.88rem; min-height:1.2em;}
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}
  .result{margin-top:20px; border-top:1px solid var(--border); padding-top:16px;}
  .result h2{font-size:1rem; margin:0 0 8px;}
  .codes{
    max-height:180px; overflow-y:auto; background:#0f172a; border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; font-family:monospace; font-size:.85rem; line-height:1.6;
  }
  .count{color:var(--muted); font-size:.82rem; margin-top:6px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Extraer códigos de un PDF</h1>
    <p class="sub">Sube un PDF con los códigos, elige el modo de extracción y descarga la lista en Excel.</p>

    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="application/pdf">
      <div class="icon">📄</div>
      <div>Haz clic o arrastra un PDF aquí</div>
      <div class="fname" id="fname"></div>
    </label>

    <label class="opt">
      Modo de extracción:
      <select id="mode" style="padding:4px 8px; background:#0f172a; border:1px solid var(--border); color:var(--text); border-radius:6px;">
        <option value="folio">Folio (reporte tipo laboratorio)</option>
        <option value="generic">Número genérico</option>
      </select>
    </label>

    <label class="opt" id="minLenWrap" style="display:none;">
      Largo mínimo del código:
      <input type="number" id="minLen" value="4" min="1" max="30">
      dígitos
    </label>

    <button id="processBtn" disabled>Procesar PDF</button>

    <div class="status" id="status"></div>

    <div class="result" id="result" style="display:none;">
      <h2>Códigos encontrados</h2>
      <div class="codes" id="codesList"></div>
      <div class="count" id="count"></div>
      <button id="downloadBtn" style="margin-top:14px;">Descargar Excel</button>
    </div>
  </div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fnameEl = document.getElementById('fname');
const processBtn = document.getElementById('processBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const codesListEl = document.getElementById('codesList');
const countEl = document.getElementById('count');
const downloadBtn = document.getElementById('downloadBtn');
const minLenInput = document.getElementById('minLen');
const modeSelect = document.getElementById('mode');
const minLenWrap = document.getElementById('minLenWrap');

let selectedFile = null;
let extractedCodes = [];
let extractedRecords = [];
let extractedDateLabel = '';

const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function buildDateLabel(fullText){
  const m = fullText.match(/Ex[aá]menes desde\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})\s+hata\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})/i)
    || fullText.match(/Ex[aá]menes desde\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})\s+hasta\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})/i);
  if (!m) return '';
  const [, d1, mo1, y1, d2, mo2, y2] = m;
  const mesNombre = (mo) => MESES_ES[parseInt(mo, 10) - 1] || mo;
  if (d1 === d2 && mo1 === mo2 && y1 === y2) {
    return `${parseInt(d1,10)} de ${mesNombre(mo1)} ${y1}`;
  }
  if (mo1 === mo2 && y1 === y2) {
    return `${parseInt(d1,10)} al ${parseInt(d2,10)} de ${mesNombre(mo1)} ${y1}`;
  }
  return `${d1}/${mo1}/${y1} al ${d2}/${mo2}/${y2}`;
}

modeSelect.addEventListener('change', () => {
  minLenWrap.style.display = modeSelect.value === 'generic' ? 'flex' : 'none';
});

function setStatus(msg, type){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) selectFile(fileInput.files[0]);
});

['dragover','dragenter'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('drag'); })
);
['dragleave','drop'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('drag'); })
);
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) selectFile(f);
});

function selectFile(file){
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    setStatus('Por favor selecciona un archivo PDF.', 'err');
    return;
  }
  selectedFile = file;
  fnameEl.textContent = file.name;
  processBtn.disabled = false;
  resultEl.style.display = 'none';
  setStatus('');
}

processBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  processBtn.disabled = true;
  setStatus('Leyendo PDF...');
  try {
    const buffer = await selectedFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let fullText = '';
    const allLines = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      setStatus(`Extrayendo texto (página ${i} de ${pdf.numPages})...`);
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      // Reconstruye el texto en orden visual (fila por fila, izquierda a derecha)
      // usando las coordenadas de cada fragmento, en vez del orden interno del PDF,
      // que en reportes tabulares suele venir columna por columna.
      const items = content.items
        .filter(it => it.str && it.str.trim() !== '')
        .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));

      const rows = [];
      const tolerance = 3;
      items.sort((a, b) => b.y - a.y);
      for (const it of items) {
        let row = rows.find(r => Math.abs(r.y - it.y) <= tolerance);
        if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
        row.items.push(it);
      }
      const pageLines = rows.map(r => r.items.sort((a, b) => a.x - b.x).map(it => it.str).join(' ').trim());

      fullText += pageLines.join('\n') + '\n';
      allLines.push(...pageLines);
    }

    // Líneas repetidas de encabezado/pie que no son datos de un registro.
    const isBoilerplate = (line) =>
      !line ||
      /^LISTER\b/i.test(line) ||
      /^Ex[aá]menes desde/i.test(line) ||
      /^FOLIO\s+FECHA/i.test(line) ||
      /^\d{1,4}$/.test(line);

    const folioLineRegex = /^(\d+)\s+\d{2}\/\d{2}\/\d{4}\/\d{1,2}:\d{2}\s*(am|pm)/i;

    let records = [];
    if (modeSelect.value === 'folio') {
      const lines = allLines.filter(l => !isBoilerplate(l));
      for (let i = 0; i < lines.length; i++) {
        const m = folioLineRegex.exec(lines[i]);
        if (!m) continue;
        const codigo = m[1];
        const pruebaParts = [];
        let j = i + 1;
        while (j < lines.length && !folioLineRegex.test(lines[j])) {
          pruebaParts.push(lines[j]);
          j++;
        }
        records.push({ codigo, prueba: pruebaParts.join(' ').trim() });
      }
      // Elimina folios duplicados conservando la primera prueba encontrada.
      const seen = new Set();
      records = records.filter(r => {
        if (seen.has(r.codigo)) return false;
        seen.add(r.codigo);
        return true;
      });
    } else {
      const minLen = Math.max(1, parseInt(minLenInput.value, 10) || 4);
      const regex = new RegExp(`\\b\\d{${minLen},}\\b`, 'g');
      const matches = fullText.match(regex) || [];
      records = [...new Set(matches)].map(codigo => ({ codigo, prueba: '' }));
    }
    extractedRecords = records;
    extractedCodes = records.map(r => r.codigo);
    extractedDateLabel = buildDateLabel(fullText);

    if (extractedCodes.length === 0) {
      const hint = modeSelect.value === 'folio'
        ? 'No se encontraron folios. Prueba con el modo "Número genérico".'
        : 'No se encontraron códigos numéricos en el PDF. Intenta bajar el largo mínimo.';
      setStatus(hint, 'err');
      resultEl.style.display = 'none';
    } else {
      codesListEl.innerHTML = extractedRecords
        .map(r => `<div>${r.codigo}${r.prueba ? ' — ' + r.prueba : ''}</div>`)
        .join('');
      countEl.textContent = `${extractedCodes.length} código(s) único(s) encontrado(s).`;
      resultEl.style.display = 'block';
      setStatus('¡Listo!', 'ok');
    }
  } catch (err) {
    console.error(err);
    setStatus('Error al procesar el PDF: ' + err.message, 'err');
  } finally {
    processBtn.disabled = false;
  }
});

function buildStyledWorkbook(records, dateLabel) {
  const CHUNK_SIZE = 50;
  const chunks = [];
  for (let i = 0; i < records.length; i += CHUNK_SIZE) {
    chunks.push(records.slice(i, i + CHUNK_SIZE));
  }
  if (chunks.length === 0) chunks.push([]);

  const hair = { style: 'hair', color: { rgb: '000000' } };
  const borderAll = { top: hair, bottom: hair, left: hair, right: hair };
  const borderNoTop = { bottom: hair, left: hair, right: hair };

  const STYLE_TITLE = {
    font: { name: 'Calibri', sz: 14, bold: true },
    alignment: { horizontal: 'center', vertical: 'center' },
    fill: { patternType: 'solid', fgColor: { rgb: 'EEECE1' } },
    border: borderAll,
    numFmt: '@'
  };
  const STYLE_HEADER_CODIGO = { font: { name: 'Tw Cen MT', sz: 12, bold: true }, alignment: { horizontal: 'center' }, border: borderNoTop };
  const STYLE_HEADER_PRUEBA = { font: { name: 'Tw Cen MT', sz: 12, bold: true }, alignment: { horizontal: 'left' }, border: borderNoTop };
  const STYLE_SPACER = { font: { name: 'Calibri', sz: 12 }, border: borderAll };
  const STYLE_CHECKBOX = { font: { name: 'Calibri', sz: 12 }, alignment: { horizontal: 'center', vertical: 'center' }, border: borderAll };
  const STYLE_CODIGO = { font: { name: 'Calibri', sz: 10, bold: true }, alignment: { horizontal: 'center' }, border: borderAll };
  const STYLE_PRUEBA = { font: { name: 'Calibri', sz: 8 }, border: borderAll };

  // Diseño de columnas: primer bloque lleva casilla de verificación + Codigo + Prueba;
  // cada bloque siguiente agrega un separador y su propio par Codigo/Prueba.
  const colMeta = [];
  const colWidths = [];
  chunks.forEach((chunk, b) => {
    if (b === 0) { colMeta.push({ type: 'checkbox' }); colWidths.push(3.875); }
    colMeta.push({ type: 'codigo', block: b }); colWidths.push(7.75);
    colMeta.push({ type: 'prueba', block: b }); colWidths.push(19.625);
    if (b < chunks.length - 1) { colMeta.push({ type: 'spacer' }); colWidths.push(4); }
  });

  const ws = {};
  const totalCols = colMeta.length;
  const maxLen = Math.max(0, ...chunks.map(c => c.length));

  for (let c = 0; c < totalCols; c++) {
    ws[XLSX.utils.encode_cell({ r: 0, c })] = { t: 's', v: c === 0 ? (dateLabel || '') : '', s: STYLE_TITLE };
  }

  colMeta.forEach((meta, c) => {
    const addr = XLSX.utils.encode_cell({ r: 1, c });
    if (meta.type === 'codigo') ws[addr] = { t: 's', v: 'Codigo', s: STYLE_HEADER_CODIGO };
    else if (meta.type === 'prueba') ws[addr] = { t: 's', v: 'Prueba', s: STYLE_HEADER_PRUEBA };
    else ws[addr] = { t: 's', v: '', s: STYLE_SPACER };
  });

  for (let r = 0; r < maxLen; r++) {
    const rowIdx = 2 + r;
    colMeta.forEach((meta, c) => {
      const addr = XLSX.utils.encode_cell({ r: rowIdx, c });
      if (meta.type === 'checkbox') {
        if (r < chunks[0].length) ws[addr] = { t: 's', v: '☐', s: STYLE_CHECKBOX };
      } else if (meta.type === 'codigo') {
        const rec = chunks[meta.block][r];
        ws[addr] = { t: 's', v: rec ? rec.codigo : '', s: STYLE_CODIGO };
      } else if (meta.type === 'prueba') {
        const rec = chunks[meta.block][r];
        ws[addr] = { t: 's', v: rec ? rec.prueba : '', s: STYLE_PRUEBA };
      } else {
        ws[addr] = { t: 's', v: '', s: STYLE_SPACER };
      }
    });
  }

  const lastRow = 2 + maxLen;
  ws['!ref'] = `A1:${XLSX.utils.encode_col(totalCols - 1)}${lastRow}`;
  ws['!cols'] = colWidths.map(w => ({ wch: w }));
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } }];
  ws['!rows'] = [{ hpt: 18.75 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Codigos');
  return wb;
}

downloadBtn.addEventListener('click', () => {
  if (extractedRecords.length === 0) return;
  const wb = buildStyledWorkbook(extractedRecords, extractedDateLabel);
  const baseName = (selectedFile && selectedFile.name.replace(/\.pdf$/i, '')) || 'codigos';
  XLSX.writeFile(wb, `${baseName}-codigos.xlsx`);
});
</script>
</body>
</html>
