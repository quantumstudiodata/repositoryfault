<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraer códigos de PDF a Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --text:#e8e8e6; --muted:#8a8a86; --border:#2a2a28;
    --accent:#e8e8e6; --ok:#7a9a7a; --err:#c97a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:480px;
  }
  .icon-svg{ display:block; stroke:currentColor; fill:none; stroke-width:1.4; }
  h1{font-size:1.25rem; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em;}
  p.sub{color:var(--muted); margin:0 0 32px; font-size:.88rem; line-height:1.5;}
  .drop{
    border:1px solid var(--border); border-radius:6px; padding:36px 16px;
    text-align:center; cursor:pointer; transition:.15s; margin-bottom:20px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .drop:hover, .drop.drag{ border-color:var(--text); }
  .drop input{display:none;}
  .drop .icon-svg{ color:var(--muted); }
  .drop .label{font-size:.88rem; color:var(--text);}
  .drop .hint{font-size:.78rem; color:var(--muted);}
  .drop .fname{color:var(--text); margin-top:4px; font-size:.82rem; word-break:break-all;}
  label.opt{display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--muted); margin-bottom:14px;}
  label.opt select, label.opt input{
    flex:1; padding:8px 10px; background:transparent; border:1px solid var(--border);
    color:var(--text); border-radius:6px; font-size:.82rem;
  }
  label.opt input{flex:none; width:64px;}
  button{
    width:100%; padding:12px; border:1px solid var(--text); border-radius:6px; background:transparent;
    color:var(--text); font-weight:600; font-size:.9rem; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:hover:not(:disabled){background:var(--text); color:var(--bg);}
  button:hover:not(:disabled) .icon-svg{stroke:var(--bg);}
  .status{margin-top:14px; font-size:.82rem; min-height:1.2em; display:flex; align-items:center; gap:6px;}
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}
  .result{margin-top:28px; border-top:1px solid var(--border); padding-top:20px;}
  .result h2{font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px;}
  .codes{
    max-height:180px; overflow-y:auto; border:1px solid var(--border);
    border-radius:6px; padding:4px 14px; font-family:ui-monospace,monospace; font-size:.82rem; line-height:1.9;
  }
  .codes > div{ border-bottom:1px solid var(--border); padding:4px 0; }
  .codes > div:last-child{ border-bottom:none; }
  .count{color:var(--muted); font-size:.78rem; margin-top:8px;}
  #downloadBtn{margin-top:14px; border-color:var(--border);}
  #downloadBtn:hover{background:var(--text); color:var(--bg);}
</style>
</head>
<body>
  <div class="card">
    <h1>Extraer códigos de un PDF</h1>
    <p class="sub">Sube un PDF con los códigos, elige el modo de extracción y descarga la lista en Excel.</p>

    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="application/pdf">
      <svg class="icon-svg" width="28" height="28" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/></svg>
      <div class="label">Arrastra tu PDF aquí o haz clic</div>
      <div class="hint">Solo archivos .pdf</div>
      <div class="fname" id="fname"></div>
    </label>

    <label class="opt">
      Modo de extracción
      <select id="mode">
        <option value="folio">Folio y texto</option>
        <option value="generic">Número genérico</option>
      </select>
    </label>

    <label class="opt" id="minLenWrap" style="display:none;">
      Largo mínimo
      <input type="number" id="minLen" value="4" min="1" max="30">
    </label>

    <button id="processBtn" disabled>
      <svg class="icon-svg" width="15" height="15" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
      Procesar PDF
    </button>

    <div class="status" id="status"></div>

    <div class="result" id="result" style="display:none;">
      <h2>Códigos encontrados</h2>
      <div class="codes" id="codesList"></div>
      <div class="count" id="count"></div>
      <button id="downloadBtn">
        <svg class="icon-svg" width="15" height="15" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        Descargar Excel
      </button>
    </div>
  </div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fnameEl = document.getElementById('fname');
const processBtn = document.getElementById('processBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const codesListEl = document.getElementById('codesList');
const countEl = document.getElementById('count');
const downloadBtn = document.getElementById('downloadBtn');
const minLenInput = document.getElementById('minLen');
const modeSelect = document.getElementById('mode');
const minLenWrap = document.getElementById('minLenWrap');

let selectedFile = null;
let extractedCodes = [];
let extractedRecords = [];
let extractedDateLabel = '';

const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function buildDateLabel(fullText){
  const m = fullText.match(/Ex[aá]menes desde\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})\s+hata\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})/i)
    || fullText.match(/Ex[aá]menes desde\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})\s+hasta\s+el\s+dia\s+(\d{2})\/(\d{2})\/(\d{4})/i);
  if (!m) return '';
  const [, d1, mo1, y1, d2, mo2, y2] = m;
  const mesNombre = (mo) => MESES_ES[parseInt(mo, 10) - 1] || mo;
  if (d1 === d2 && mo1 === mo2 && y1 === y2) {
    return `${parseInt(d1,10)} de ${mesNombre(mo1)} ${y1}`;
  }
  if (mo1 === mo2 && y1 === y2) {
    return `${parseInt(d1,10)} al ${parseInt(d2,10)} de ${mesNombre(mo1)} ${y1}`;
  }
  return `${d1}/${mo1}/${y1} al ${d2}/${mo2}/${y2}`;
}

modeSelect.addEventListener('change', () => {
  minLenWrap.style.display = modeSelect.value === 'generic' ? 'flex' : 'none';
});

function setStatus(msg, type){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) selectFile(fileInput.files[0]);
});

['dragover','dragenter'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('drag'); })
);
['dragleave','drop'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('drag'); })
);
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) selectFile(f);
});

function selectFile(file){
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    setStatus('Por favor selecciona un archivo PDF.', 'err');
    return;
  }
  selectedFile = file;
  fnameEl.textContent = file.name;
  processBtn.disabled = false;
  resultEl.style.display = 'none';
  setStatus('');
}

processBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  processBtn.disabled = true;
  setStatus('Leyendo PDF...');
  try {
    const buffer = await selectedFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let fullText = '';
    const allLines = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      setStatus(`Extrayendo texto (página ${i} de ${pdf.numPages})...`);
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();

      // Reconstruye el texto en orden visual (fila por fila, izquierda a derecha)
      // usando las coordenadas de cada fragmento, en vez del orden interno del PDF,
      // que en reportes tabulares suele venir columna por columna.
      const items = content.items
        .filter(it => it.str && it.str.trim() !== '')
        .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));

      const rows = [];
      const tolerance = 3;
      items.sort((a, b) => b.y - a.y);
      for (const it of items) {
        let row = rows.find(r => Math.abs(r.y - it.y) <= tolerance);
        if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
        row.items.push(it);
      }
      const pageLines = rows.map(r => r.items.sort((a, b) => a.x - b.x).map(it => it.str).join(' ').trim());

      fullText += pageLines.join('\n') + '\n';
      allLines.push(...pageLines);
    }

    // Líneas repetidas de encabezado/pie/etiquetas de columna que no son datos de un registro.
    const isBoilerplate = (line) =>
      !line ||
      /^LISTER\b/i.test(line) ||
      /^Ex[aá]menes desde/i.test(line) ||
      /^FOLIO\s+FECHA/i.test(line) ||
      /^\d{1,4}$/.test(line) ||
      /^FECHA$/i.test(line) ||
      /^PACIENTE$/i.test(line) ||
      /^FEC\.?\s*NACI$/i.test(line) ||
      /^S$/i.test(line) ||
      /^TELEFONO$/i.test(line) ||
      /^MEDICO$/i.test(line);

    // El folio siempre abre línea con 6-10 dígitos, ya sea solo o seguido de la fecha
    // (el orden folio/prueba/fecha varía según el reporte, y el espaciado alrededor de
    // las barras de la fecha es irregular, así que no dependemos de esos detalles).
    const folioMarkerRegex = /^(\d{6,10})\b/;

    // Una línea "prueba" es corta, sin fecha de nacimiento, edad, teléfono ni género:
    // esos patrones aparecen sueltos en reportes cuyo layout separa cada campo en su
    // propia línea (p.ej. un registro que cae justo en un salto de página).
    function looksLikePrueba(line) {
      if (line.length > 24) return false;
      if (/\d{2}\/\d{2}\/\d{4}/.test(line)) return false;
      if (/^\d{1,3}\s*A(ños)?$/i.test(line)) return false;
      if (/^[\d\s.\-()]+$/.test(line)) return false;
      if (/^[MF]$/i.test(line)) return false;
      return true;
    }

    let records = [];
    if (modeSelect.value === 'folio') {
      const lines = allLines.map(l => l.trim()).filter(l => !isBoilerplate(l));
      for (let i = 0; i < lines.length; i++) {
        const m = folioMarkerRegex.exec(lines[i]);
        if (!m) continue;
        const codigo = m[1];
        const pruebaParts = [];
        let j = i + 1;
        while (j < lines.length && !folioMarkerRegex.test(lines[j])) {
          if (looksLikePrueba(lines[j])) pruebaParts.push(lines[j]);
          j++;
        }
        records.push({ codigo, prueba: pruebaParts.join(' ').trim() });
      }
      // Elimina folios duplicados conservando la primera prueba encontrada.
      const seen = new Set();
      records = records.filter(r => {
        if (seen.has(r.codigo)) return false;
        seen.add(r.codigo);
        return true;
      });
    } else {
      const minLen = Math.max(1, parseInt(minLenInput.value, 10) || 4);
      const regex = new RegExp(`\\b\\d{${minLen},}\\b`, 'g');
      const matches = fullText.match(regex) || [];
      records = [...new Set(matches)].map(codigo => ({ codigo, prueba: '' }));
    }
    extractedRecords = records;
    extractedCodes = records.map(r => r.codigo);
    extractedDateLabel = buildDateLabel(fullText);

    if (extractedCodes.length === 0) {
      const hint = modeSelect.value === 'folio'
        ? 'No se encontraron folios. Prueba con el modo "Número genérico".'
        : 'No se encontraron códigos numéricos en el PDF. Intenta bajar el largo mínimo.';
      setStatus(hint, 'err');
      resultEl.style.display = 'none';
    } else {
      codesListEl.innerHTML = extractedRecords
        .map(r => `<div>${r.codigo}${r.prueba ? ' — ' + r.prueba : ''}</div>`)
        .join('');
      countEl.textContent = `${extractedCodes.length} código(s) único(s) encontrado(s).`;
      resultEl.style.display = 'block';
      setStatus('¡Listo!', 'ok');
    }
  } catch (err) {
    console.error(err);
    setStatus('Error al procesar el PDF: ' + err.message, 'err');
  } finally {
    processBtn.disabled = false;
  }
});

function buildStyledWorkbook(records, dateLabel) {
  const CHUNK_SIZE = 50;
  const chunks = [];
  for (let i = 0; i < records.length; i += CHUNK_SIZE) {
    chunks.push(records.slice(i, i + CHUNK_SIZE));
  }
  if (chunks.length === 0) chunks.push([]);

  const hair = { style: 'hair', color: { rgb: '000000' } };
  const borderAll = { top: hair, bottom: hair, left: hair, right: hair };
  const borderNoTop = { bottom: hair, left: hair, right: hair };

  const STYLE_TITLE = {
    font: { name: 'Calibri', sz: 14, bold: true },
    alignment: { horizontal: 'center', vertical: 'center' },
    fill: { patternType: 'solid', fgColor: { rgb: 'EEECE1' } },
    border: borderAll,
    numFmt: '@'
  };
  const STYLE_HEADER_CODIGO = { font: { name: 'Tw Cen MT', sz: 12, bold: true }, alignment: { horizontal: 'center' }, border: borderNoTop };
  const STYLE_HEADER_PRUEBA = { font: { name: 'Tw Cen MT', sz: 12, bold: true }, alignment: { horizontal: 'left' }, border: borderNoTop };
  const STYLE_SPACER = { font: { name: 'Calibri', sz: 12 }, border: borderAll };
  const STYLE_CHECKBOX = { font: { name: 'Calibri', sz: 12 }, alignment: { horizontal: 'center', vertical: 'center' }, border: borderAll };
  const STYLE_CODIGO = { font: { name: 'Calibri', sz: 10, bold: true }, alignment: { horizontal: 'center' }, border: borderAll };
  const STYLE_PRUEBA = { font: { name: 'Calibri', sz: 8 }, border: borderAll };

  // Diseño de columnas: primer bloque lleva casilla de verificación + Codigo + Prueba;
  // cada bloque siguiente agrega un separador y su propio par Codigo/Prueba.
  const colMeta = [];
  const colWidths = [];
  chunks.forEach((chunk, b) => {
    if (b === 0) { colMeta.push({ type: 'checkbox' }); colWidths.push(3.875); }
    colMeta.push({ type: 'codigo', block: b }); colWidths.push(7.75);
    colMeta.push({ type: 'prueba', block: b }); colWidths.push(19.625);
    if (b < chunks.length - 1) { colMeta.push({ type: 'spacer' }); colWidths.push(4); }
  });

  const ws = {};
  const totalCols = colMeta.length;
  const maxLen = Math.max(0, ...chunks.map(c => c.length));

  for (let c = 0; c < totalCols; c++) {
    ws[XLSX.utils.encode_cell({ r: 0, c })] = { t: 's', v: c === 0 ? (dateLabel || '') : '', s: STYLE_TITLE };
  }

  colMeta.forEach((meta, c) => {
    const addr = XLSX.utils.encode_cell({ r: 1, c });
    if (meta.type === 'codigo') ws[addr] = { t: 's', v: 'Codigo', s: STYLE_HEADER_CODIGO };
    else if (meta.type === 'prueba') ws[addr] = { t: 's', v: 'Prueba', s: STYLE_HEADER_PRUEBA };
    else ws[addr] = { t: 's', v: '', s: STYLE_SPACER };
  });

  for (let r = 0; r < maxLen; r++) {
    const rowIdx = 2 + r;
    colMeta.forEach((meta, c) => {
      const addr = XLSX.utils.encode_cell({ r: rowIdx, c });
      if (meta.type === 'checkbox') {
        if (r < chunks[0].length) ws[addr] = { t: 's', v: '☐', s: STYLE_CHECKBOX };
      } else if (meta.type === 'codigo') {
        const rec = chunks[meta.block][r];
        ws[addr] = { t: 's', v: rec ? rec.codigo : '', s: STYLE_CODIGO };
      } else if (meta.type === 'prueba') {
        const rec = chunks[meta.block][r];
        ws[addr] = { t: 's', v: rec ? rec.prueba : '', s: STYLE_PRUEBA };
      } else {
        ws[addr] = { t: 's', v: '', s: STYLE_SPACER };
      }
    });
  }

  const lastRow = 2 + maxLen;
  ws['!ref'] = `A1:${XLSX.utils.encode_col(totalCols - 1)}${lastRow}`;
  ws['!cols'] = colWidths.map(w => ({ wch: w }));
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } }];
  ws['!rows'] = [{ hpt: 18.75 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Codigos');
  return wb;
}

downloadBtn.addEventListener('click', () => {
  if (extractedRecords.length === 0) return;
  const wb = buildStyledWorkbook(extractedRecords, extractedDateLabel);
  const baseName = (selectedFile && selectedFile.name.replace(/\.pdf$/i, '')) || 'codigos';
  XLSX.writeFile(wb, `${baseName}-codigos.xlsx`);
});
</script>
</body>
</html>
